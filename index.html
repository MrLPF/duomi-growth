<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff9ebb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="多米成长">
<meta name="description" content="多米的成长与喝奶记录">
<link rel="canonical" href="https://duomi.933520.xyz/">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.svg">
<title>多米的成长记录 🌱</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;color:#5d4e60;background:#fff9fa}body{padding-bottom:env(safe-area-inset-bottom)}body:before,body:after{content:"";position:fixed;border-radius:50%;opacity:.14;z-index:0;pointer-events:none}body:before{width:210px;height:210px;background:#ffd700;right:-70px;top:12%;animation:float 8s ease-in-out infinite}body:after{width:160px;height:160px;background:#ff9ebb;left:-55px;bottom:12%;animation:float 10s ease-in-out infinite reverse}@keyframes float{50%{transform:translateY(-18px) scale(1.04)}}
.sparkles{position:fixed;inset:0;z-index:0;pointer-events:none}.sparkles span{position:absolute;color:#ffd166;opacity:.35;animation:twinkle 5s ease-in-out infinite}.sparkles span:nth-child(1){left:8%;top:18%}.sparkles span:nth-child(2){right:8%;top:38%;animation-delay:1s}.sparkles span:nth-child(3){left:24%;bottom:14%;animation-delay:2s}@keyframes twinkle{50%{opacity:.08;transform:translateY(-12px) rotate(90deg)}}
.navbar{position:sticky;top:0;z-index:20;height:64px;padding:0 max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,#fff0f5,#fff);box-shadow:0 2px 14px rgba(255,158,187,.18)}.brand{font-weight:800;color:#ff86ad;white-space:nowrap}.tabs{display:flex;gap:5px;flex:1;justify-content:center}.tab{border:0;background:transparent;color:#a99baa;padding:9px 18px;border-radius:999px;font:inherit;cursor:pointer}.tab.active{background:#ff9ebb;color:#fff;font-weight:700}.settings{border:0;background:#fff0f5;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.wrap{position:relative;z-index:1;max-width:920px;margin:auto;padding:24px 16px}.page{display:none}.page.active{display:block}.hero{padding:26px;background:linear-gradient(135deg,#fff,#fff0f5);border:1px solid #f5dce6;border-radius:22px;box-shadow:0 8px 30px rgba(255,158,187,.12);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:28px;color:#ff86ad}.hero p{margin:0;color:#8f8091}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.stat{background:#fff;border:1px solid #f2e0e7;border-radius:16px;padding:15px;text-align:center}.stat b{display:block;font-size:22px;color:#ff86ad}.stat span{font-size:12px;color:#a99baa}
.card{background:#fff;border:1px solid #f0e0e8;border-radius:18px;padding:22px;margin:0 0 18px;box-shadow:0 5px 24px rgba(255,158,187,.1)}.card h2{margin:0 0 18px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}label{display:grid;gap:7px;font-size:14px;font-weight:600}input,select,textarea{width:100%;border:1px solid #f0dce5;background:#fff;border-radius:13px;padding:11px 13px;font:inherit;color:#5d4e60;outline:none}input:focus,select:focus,textarea:focus{border-color:#ff9ebb;box-shadow:0 0 0 3px rgba(255,158,187,.14)}button.primary{border:0;background:#ff9ebb;color:#fff;border-radius:999px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}button.secondary{border:0;background:#fff0f5;color:#ff7ca7;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer}button.danger{border:0;background:#fff0f0;color:#e66b7a;border-radius:999px;padding:8px 13px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}
.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:1px solid #f3e4ea;border-radius:16px;padding:15px;background:#fffdfd}.item-title{font-weight:800}.item-meta{font-size:13px;color:#9d8fa0;margin-top:4px}.badge{display:inline-flex;margin-right:6px;padding:3px 9px;border-radius:999px;background:#fff0f5;color:#ff7ca7;font-size:12px}.amount{font-size:21px;font-weight:800;color:#ff86ad}.empty{text-align:center;padding:35px;color:#aa9daa}.empty .emoji{font-size:40px}.date-filter{display:flex;align-items:end;gap:12px;margin-bottom:16px}.date-filter label{flex:1}.chart{width:100%;height:280px;border-radius:16px;background:linear-gradient(#fffafd,#fff);border:1px solid #f3e5eb;overflow:hidden}.chart svg{width:100%;height:100%}.legend{display:flex;gap:16px;font-size:13px;color:#8d7f90;margin-top:10px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}.toast{position:fixed;top:82px;left:50%;transform:translateX(-50%) translateY(-15px);z-index:99;background:#5d4e60;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(93,78,96,.28);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(93,78,96,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0}.close{border:0;background:#fff0f5;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
@media(max-width:700px){.navbar{height:auto;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.brand{font-size:16px}.tabs{order:3;width:100%;overflow:auto;justify-content:flex-start;padding-bottom:2px}.tab{padding:8px 14px;white-space:nowrap}.wrap{padding-top:16px}.hero h1{font-size:23px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.item{grid-template-columns:1fr}.item>div:last-child{text-align:left}.chart{height:230px}}
</style>
</head>
<body>
<div class="sparkles"><span>✦</span><span>✧</span><span>★</span></div>
<nav class="navbar"><div class="brand" id="brand">多米的成长记录 🌱</div><div class="tabs"><button class="tab active" data-page="milk">🍼 喝奶记录</button><button class="tab" data-page="growth">📏 成长记录</button><button class="tab" data-page="trend">📈 成长曲线</button></div><button class="settings" id="settingsBtn" aria-label="设置">⚙️</button></nav>
<main class="wrap">
<section class="page active" id="milkPage">
<div class="hero"><h1 id="milkGreeting">今天也要好好长大呀 ✨</h1><p>轻松记录每一次喝奶，自动计算当天累计量。</p><div class="stats"><div class="stat"><b id="todayMilk">0 ml</b><span>今日总量</span></div><div class="stat"><b id="todayCount">0 次</b><span>今日次数</span></div><div class="stat"><b id="latestMilk">暂无</b><span>最近一次</span></div></div></div>
<div class="card"><h2>新增喝奶记录 🍼</h2><form id="milkForm" class="grid"><label>日期<input id="milkDate" type="date" required></label><label>时间<input id="milkTime" type="time" required></label><label>奶量（ml）<input id="milkAmount" type="number" min="1" max="500" required placeholder="例如 120"></label><label>类型<select id="milkType"><option value="breast">🤱 母乳</option><option value="formula">🍼 奶粉</option></select></label><button class="primary wide">保存喝奶记录</button></form></div>
<div class="card"><div class="date-filter"><label>查看日期<input id="milkFilter" type="date"></label><button class="secondary" id="milkTodayBtn">今天</button></div><div id="milkList" class="list"></div></div>
</section>
<section class="page" id="growthPage">
<div class="hero"><h1>记录每一点成长 🌱</h1><p>身高、体重与可爱的成长瞬间，都值得被珍藏。</p><div class="stats"><div class="stat"><b id="latestHeight">—</b><span>最新身高</span></div><div class="stat"><b id="latestWeight">—</b><span>最新体重</span></div><div class="stat"><b id="growthCount">0 条</b><span>成长记录</span></div></div></div>
<div class="card"><h2>新增成长记录 📏</h2><form id="growthForm" class="grid"><label>日期<input id="growthDate" type="date" required></label><label>身高（cm）<input id="height" type="number" step="0.1" min="20" max="220" placeholder="例如 68.5"></label><label>体重（kg）<input id="weight" type="number" step="0.01" min="1" max="150" placeholder="例如 8.20"></label><label class="wide">成长备注<textarea id="note" rows="3" maxlength="300" placeholder="例如：今天第一次会翻身啦"></textarea></label><button class="primary wide">保存成长记录</button></form></div>
<div class="card"><h2>历史记录</h2><div id="growthList" class="list"></div></div>
</section>
<section class="page" id="trendPage"><div class="hero"><h1>成长曲线 📈</h1><p>用趋势观察多米一点一滴的变化。</p></div><div class="card"><h2>身高与体重趋势</h2><div class="chart" id="chart"></div><div class="legend"><span><i class="dot" style="background:#ff9ebb"></i>身高 cm</span><span><i class="dot" style="background:#7ec8e3"></i>体重 kg</span></div></div></section>
</main>
<div class="modal" id="settingsModal"><div class="modal-box"><div class="modal-head"><h2>宝宝信息 👶</h2><button class="close" id="closeSettings">×</button></div><form id="settingsForm" class="grid"><label class="wide">宝宝昵称<input id="babyName" maxlength="20" placeholder="多米"></label><label>出生日期<input id="birthday" type="date"></label><label>性别<select id="gender"><option value="">未设置</option><option value="girl">女孩</option><option value="boy">男孩</option></select></label><button class="primary wide">保存设置</button></form><hr style="border:0;border-top:1px solid #f1e2e8;margin:22px 0"><div class="actions"><button class="secondary" id="exportBtn" type="button">导出数据</button><label class="secondary" style="display:inline-flex;cursor:pointer">导入数据<input id="importFile" type="file" accept="application/json" hidden></label><button class="danger" id="clearBtn" type="button">清空全部数据</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEYS={milk:'childMilkRecords',growth:'childGrowthRecords',info:'childGrowthInfo'};const $=s=>document.querySelector(s);const today=()=>new Date().toISOString().slice(0,10);const nowTime=()=>new Date().toTimeString().slice(0,5);const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let milk=load(KEYS.milk),growth=load(KEYS.growth),info=(()=>{try{return JSON.parse(localStorage.getItem(KEYS.info))||{}}catch{return {}}})();
function toast(msg){const n=$('#toast');n.textContent=msg;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1800)}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function nav(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('#'+page+'Page').classList.add('active');location.hash=page;if(page==='trend')renderChart()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function renderInfo(){const name=info.name||'多米';$('#brand').textContent=name+'的成长记录 🌱';$('#milkGreeting').textContent=name+'今天也要好好长大呀 ✨';$('#babyName').value=info.name||'';$('#birthday').value=info.birthday||'';$('#gender').value=info.gender||''}
function renderMilk(){const d=$('#milkFilter').value||today();const rows=milk.filter(r=>r.date===d).sort((a,b)=>a.time.localeCompare(b.time));const todayRows=milk.filter(r=>r.date===today());$('#todayMilk').textContent=todayRows.reduce((s,r)=>s+Number(r.amount),0)+' ml';$('#todayCount').textContent=todayRows.length+' 次';const latest=[...milk].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];$('#latestMilk').textContent=latest?latest.amount+' ml':'暂无';$('#milkList').innerHTML=rows.length?rows.map((r,i)=>`<div class="item"><div><div class="item-title">⏰ ${esc(r.time)} <span class="badge">${r.type==='breast'?'🤱 母乳':'🍼 奶粉'}</span></div><div class="item-meta">${esc(r.date)} · 当日累计 ${rows.slice(0,i+1).reduce((s,x)=>s+Number(x.amount),0)} ml</div></div><div><div class="amount">${r.amount} ml</div><button class="danger" onclick="removeMilk('${r.id}')">删除</button></div></div>`).join(''):`<div class="empty"><div class="emoji">🍼🧸</div>这一天还没有喝奶记录哦~</div>`}
window.removeMilk=id=>{if(confirm('确定删除这条喝奶记录？')){milk=milk.filter(r=>r.id!==id);save(KEYS.milk,milk);renderMilk();toast('已删除')}};
$('#milkForm').onsubmit=e=>{e.preventDefault();milk.push({id:uid(),date:$('#milkDate').value,time:$('#milkTime').value,amount:Number($('#milkAmount').value),type:$('#milkType').value});save(KEYS.milk,milk);$('#milkAmount').value='';renderMilk();toast('喝奶记录已保存 ✨')};$('#milkFilter').onchange=renderMilk;$('#milkTodayBtn').onclick=()=>{$('#milkFilter').value=today();renderMilk()};
function renderGrowth(){const rows=[...growth].sort((a,b)=>b.date.localeCompare(a.date));const latest=rows[0];$('#latestHeight').textContent=latest&&latest.height?latest.height+' cm':'—';$('#latestWeight').textContent=latest&&latest.weight?latest.weight+' kg':'—';$('#growthCount').textContent=rows.length+' 条';$('#growthList').innerHTML=rows.length?rows.map(r=>`<div class="item"><div><div class="item-title">🌱 ${esc(r.date)}</div><div class="item-meta">${r.note?esc(r.note):'今天也在认真长大'}</div></div><div><div>${r.height?`<span class="badge">📏 ${r.height} cm</span>`:''}${r.weight?`<span class="badge">⚖️ ${r.weight} kg</span>`:''}</div><button class="danger" onclick="removeGrowth('${r.id}')">删除</button></div></div>`).join(''):`<div class="empty"><div class="emoji">🌱📏</div>还没有成长记录，开始记录吧~</div>`}
window.removeGrowth=id=>{if(confirm('确定删除这条成长记录？')){growth=growth.filter(r=>r.id!==id);save(KEYS.growth,growth);renderGrowth();renderChart();toast('已删除')}};
$('#growthForm').onsubmit=e=>{e.preventDefault();if(!$('#height').value&&!$('#weight').value&&!$('#note').value.trim()){toast('请至少填写一项内容');return}growth.push({id:uid(),date:$('#growthDate').value,height:$('#height').value?Number($('#height').value):'',weight:$('#weight').value?Number($('#weight').value):'',note:$('#note').value.trim()});save(KEYS.growth,growth);$('#height').value=$('#weight').value=$('#note').value='';renderGrowth();renderChart();toast('成长记录已保存 🌱')};
function renderChart(){const data=[...growth].sort((a,b)=>a.date.localeCompare(b.date));if(!data.length){$('#chart').innerHTML='<div class="empty"><div class="emoji">📈</div>添加成长记录后，这里会显示曲线</div>';return}const W=800,H=280,p=42;const valsH=data.filter(x=>x.height).map(x=>Number(x.height)),valsW=data.filter(x=>x.weight).map(x=>Number(x.weight));const minmax=a=>{if(!a.length)return[0,1];let mn=Math.min(...a),mx=Math.max(...a);if(mn===mx){mn-=1;mx+=1}return[mn,mx]};const [hmin,hmax]=minmax(valsH),[wmin,wmax]=minmax(valsW);const x=i=>p+(W-2*p)*(data.length===1?.5:i/(data.length-1));const y=(v,mn,mx)=>H-p-(H-2*p)*(v-mn)/(mx-mn);const path=(key,mn,mx)=>data.map((d,i)=>d[key]!==''&&d[key]!=null?`${i===0?'M':'L'}${x(i).toFixed(1)},${y(Number(d[key]),mn,mx).toFixed(1)}`:'').filter(Boolean).join(' ');const labels=data.map((d,i)=>`<text x="${x(i)}" y="264" text-anchor="middle" font-size="11" fill="#9d8fa0">${d.date.slice(5)}</text>`).join('');$('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g stroke="#f2e3e9">${[0,1,2,3,4].map(i=>`<line x1="${p}" y1="${p+i*(H-2*p)/4}" x2="${W-p}" y2="${p+i*(H-2*p)/4}"/>`).join('')}</g><path d="${path('height',hmin,hmax)}" fill="none" stroke="#ff9ebb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="${path('weight',wmin,wmax)}" fill="none" stroke="#7ec8e3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${labels}</svg>`}
const modal=$('#settingsModal');$('#settingsBtn').onclick=()=>modal.classList.add('show');$('#closeSettings').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};$('#settingsForm').onsubmit=e=>{e.preventDefault();info={name:$('#babyName').value.trim()||'多米',birthday:$('#birthday').value,gender:$('#gender').value};localStorage.setItem(KEYS.info,JSON.stringify(info));renderInfo();modal.classList.remove('show');toast('宝宝信息已保存')};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'duomi-growth-backup',version:1,exportedAt:new Date().toISOString(),info,milk,growth},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`多米成长记录-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(obj.format!=='duomi-growth-backup')throw Error('格式不正确');info=obj.info||{};milk=Array.isArray(obj.milk)?obj.milk:[];growth=Array.isArray(obj.growth)?obj.growth:[];localStorage.setItem(KEYS.info,JSON.stringify(info));save(KEYS.milk,milk);save(KEYS.growth,growth);renderAll();modal.classList.remove('show');toast('数据导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};$('#clearBtn').onclick=()=>{if(confirm('确定清空全部本地数据？此操作不可撤销。')){Object.values(KEYS).forEach(k=>localStorage.removeItem(k));milk=[];growth=[];info={};renderAll();modal.classList.remove('show');toast('数据已清空')}};
function renderAll(){renderInfo();renderMilk();renderGrowth();renderChart()}function init(){['milkDate','growthDate','milkFilter'].forEach(id=>$('#'+id).value=today());$('#milkTime').value=nowTime();renderAll();nav(location.hash.replace('#','')||'milk');if(!info.name)setTimeout(()=>modal.classList.add('show'),300);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>

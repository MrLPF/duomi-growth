<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>多米的成长记录 🌱</title>
  <meta name="description" content="记录多米宝宝的成长数据和每日喝奶情况">
  <meta name="theme-color" content="#FF9EBB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="成长记录">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <script src="chart.umd.min.js"></script>
  <style>
    /* ========== 基础重置与全局样式 ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", cursive, sans-serif;
      background: #FFF9FA;
      color: #5D4E60;
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ========== 装饰性浮动元素 ========== */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.15;
    }

    body::before {
      width: 200px;
      height: 200px;
      background: #FFD700;
      top: 10%;
      right: -60px;
      animation: floatBubble 8s ease-in-out infinite;
    }

    body::after {
      width: 150px;
      height: 150px;
      background: #FF9EBB;
      bottom: 15%;
      left: -40px;
      animation: floatBubble 10s ease-in-out infinite reverse;
    }

    /* 额外的星星装饰 */
    .sparkle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      color: #FFD700;
      opacity: 0;
      animation: sparkleFloat 6s ease-in-out infinite;
      font-size: 14px;
    }

    .sparkle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 40%; left: 85%; animation-delay: 2s; }
    .sparkle:nth-child(3) { top: 60%; left: 25%; animation-delay: 4s; }
    .sparkle:nth-child(4) { top: 15%; left: 60%; animation-delay: 1s; }
    .sparkle:nth-child(5) { top: 75%; left: 70%; animation-delay: 3s; }

    @keyframes floatBubble {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
      50% { opacity: 0.4; transform: translateY(-15px) scale(1) rotate(180deg); }
    }

    @keyframes gentleBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes toastBounce {
      0% { transform: translateX(-50%) translateY(-20px); }
      60% { transform: translateX(-50%) translateY(5px); }
      100% { transform: translateX(-50%) translateY(0); }
    }

    /* ========== 顶部导航栏 ========== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, #FFF0F5 0%, #FFFFFF 100%);
      border-bottom: none;
      box-shadow: 0 2px 12px rgba(255, 158, 187, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 60px;
    }

    .navbar-title {
      font-size: 20px;
      font-weight: 700;
      color: #FF9EBB;
      white-space: nowrap;
    }

    .navbar-nav {
      display: flex;
      gap: 4px;
    }

    .nav-tab {
      padding: 8px 20px;
      border: none;
      background: none;
      font-size: 15px;
      color: #A99BAA;
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease, background 0.3s ease, border-radius 0.3s ease;
      font-family: inherit;
      border-radius: 24px;
    }

    .nav-tab:hover {
      color: #FF9EBB;
      background: rgba(255, 158, 187, 0.08);
    }

    .nav-tab.active {
      color: #FFFFFF;
      font-weight: 600;
      background: #FF9EBB;
    }

    .nav-tab.active::after {
      content: '';
      display: none;
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A99BAA;
      font-size: 20px;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .settings-btn:hover {
      background: rgba(255, 158, 187, 0.1);
      color: #FF9EBB;
      transform: scale(1.1);
    }

    /* ========== 页面内容区 ========== */
    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      position: relative;
      z-index: 1;
    }

    .page-section {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .page-section.active {
      display: block;
      opacity: 1;
    }

    /* ========== 卡片样式 ========== */
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(255, 158, 187, 0.1);
      border: 1px solid #F0E0E8;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #5D4E60;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: none;
    }

    /* ========== 表单样式 ========== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #5D4E60;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #F0E0E8;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: #5D4E60;
      background: #FFFFFF;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: #FF9EBB;
      box-shadow: 0 0 0 3px rgba(255, 158, 187, 0.15);
    }

    .form-input.error {
      border-color: #FF6B8A;
      box-shadow: 0 0 0 3px rgba(255, 107, 138, 0.1);
    }

    .input-unit {
      position: absolute;
      right: 14px;
      font-size: 14px;
      color: #A99BAA;
      pointer-events: none;
    }

    .form-input.has-unit {
      padding-right: 40px;
    }

    .error-msg {
      color: #FF6B8A;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    /* ========== 按钮样式 ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease, transform 0.15s ease;
      border: none;
      font-family: inherit;
      gap: 6px;
    }

    .btn:hover {
      transform: scale(1.03);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #FF9EBB;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #FF8AA3;
      box-shadow: 0 4px 12px rgba(255, 158, 187, 0.4);
    }

    .btn-primary:active {
      background: #FF7A93;
    }

    .btn-secondary {
      background: #FFFFFF;
      color: #A99BAA;
      border: 1px solid #F0E0E8;
    }

    .btn-secondary:hover {
      background: #FFF0F5;
      border-color: #FF9EBB;
      color: #FF9EBB;
    }

    .btn-sm {
      padding: 5px 14px;
      font-size: 13px;
      border-radius: 16px;
    }

    .btn-blue {
      background: #87CEEB;
      color: #FFFFFF;
      border: none;
    }

    .btn-blue:hover {
      background: #6BC5E0;
      box-shadow: 0 4px 12px rgba(135, 206, 235, 0.4);
    }

    .btn-red {
      background: #FFFFFF;
      color: #FF6B8A;
      border: 1px solid #FF6B8A;
    }

    .btn-red:hover {
      background: #FFF0F5;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    /* ========== 表格样式 ========== */
    .table-wrapper {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .data-table thead {
      background: #FFF0F5;
    }

    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: #5D4E60;
      white-space: nowrap;
    }

    .data-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #F0E0E8;
      color: #5D4E60;
    }

    .data-table tbody tr:hover {
      background: #FFF9FA;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    /* ========== 分页 ========== */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #F0E0E8;
      background: #FFFFFF;
      color: #A99BAA;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .page-btn:hover:not(.active):not(:disabled) {
      border-color: #FF9EBB;
      color: #FF9EBB;
      transform: scale(1.05);
    }

    .page-btn.active {
      background: #FF9EBB;
      color: #FFFFFF;
      border-color: #FF9EBB;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ========== 空状态 ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #A99BAA;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.7;
    }

    .empty-state-text {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .empty-state-btn {
      display: inline-block;
      padding: 10px 24px;
      background: #FF9EBB;
      color: #FFFFFF;
      border-radius: 24px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: background 0.2s, transform 0.15s;
    }

    .empty-state-btn:hover {
      background: #FF8AA3;
      transform: scale(1.03);
    }

    /* ========== 模态框 ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 158, 187, 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.show {
      display: flex;
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px;
      width: 90%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(255, 158, 187, 0.2);
      transform: translateY(20px);
      transition: transform 0.3s;
    }

    .modal-overlay.show .modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #5D4E60;
    }

    /* ========== Toast 提示 ========== */
    .toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: #FF9EBB;
      color: #FFFFFF;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 500;
      z-index: 300;
      box-shadow: 0 4px 16px rgba(255, 158, 187, 0.4);
      transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .toast.show {
      top: 80px;
      animation: toastBounce 0.4s ease;
    }

    /* ========== 图表区域 ========== */
    .chart-container {
      position: relative;
      width: 100%;
      min-height: 400px;
    }

    .chart-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 400px;
    }

    .chart-canvas-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ========== 欢迎弹窗图标 ========== */
    .welcome-icon {
      font-size: 56px;
      text-align: center;
      margin-bottom: 16px;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .navbar {
        padding: 0 12px;
        height: auto;
        min-height: 60px;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .navbar-title {
        font-size: 16px;
      }

      .nav-tab {
        padding: 6px 12px;
        font-size: 13px;
      }

      .card {
        padding: 16px;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .data-table th,
      .data-table td {
        padding: 10px 8px;
        font-size: 13px;
      }
    }

    /* ========== 滚动条美化 ========== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #FFD0DC;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FF9EBB;
    }

    /* ========== SVG 图标（内联） ========== */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ========== 发育水平百分比标签 ========== */
    .pct-tag {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pct-good {
      background: #E8F8EA;
      color: #2E7D32;
    }

    .pct-normal {
      background: #FFF8E1;
      color: #F57F17;
    }

    .pct-low {
      background: #FFF0F0;
      color: #E53935;
    }

    .pct-na {
      color: #A99BAA;
    }

    /* ========== 每日喝奶记录 ========== */
    .milk-summary-card {
      margin-bottom: 16px;
    }

    .milk-summary-inner {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: linear-gradient(135deg, #FFF0F5, #F0F8FF);
      border-radius: 16px;
      border: 1px solid #F0E0E8;
    }

    .milk-summary-icon {
      font-size: 40px;
    }

    .milk-summary-info {
      flex: 1;
    }

    .milk-summary-label {
      font-size: 13px;
      color: #A99BAA;
      margin-bottom: 4px;
    }

    .milk-summary-total {
      font-size: 32px;
      font-weight: 700;
      color: #FF9EBB;
      line-height: 1.2;
    }

    .milk-summary-unit {
      font-size: 14px;
      font-weight: 400;
      color: #A99BAA;
    }

    .milk-summary-count {
      font-size: 14px;
      color: #A99BAA;
      text-align: center;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 16px;
      border-radius: 12px;
    }

    .milk-date-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .milk-date-filter .form-label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .milk-date-input {
      max-width: 200px;
    }

    .milk-record-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .milk-record-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #FFFAFB;
      border-radius: 14px;
      border: 1px solid #F8E8EF;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .milk-record-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(255, 158, 187, 0.15);
    }

    .milk-record-left {
      flex: 0 0 auto;
    }

    .milk-record-time {
      font-size: 15px;
      font-weight: 500;
      color: #5D4E60;
    }

    .milk-record-center {
      flex: 1;
      text-align: center;
    }

    .milk-record-amount {
      font-size: 22px;
      font-weight: 700;
      color: #FF9EBB;
    }

    .milk-record-unit {
      font-size: 13px;
      font-weight: 400;
      color: #A99BAA;
    }

    .milk-record-right {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .milk-record-running {
      font-size: 12px;
      color: #87CEEB;
      font-weight: 600;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .milk-record-item {
        flex-wrap: wrap;
      }
      .milk-record-right {
        width: 100%;
        justify-content: flex-end;
        padding-top: 4px;
        border-top: 1px dashed #F0E0E8;
      }
    }

    /* 奶类型选择 */
    .milk-type-group {
      display: flex;
      gap: 12px;
    }

    .milk-type-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 24px;
      border: 2px solid #F0E0E8;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      user-select: none;
    }

    .milk-type-option:hover {
      border-color: #FF9EBB;
    }

    .milk-type-option input[type="radio"] {
      display: none;
    }

    .milk-type-option:has(input:checked) {
      border-color: #FF9EBB;
      background: #FFF0F5;
      box-shadow: 0 0 0 2px rgba(255, 158, 187, 0.2);
    }

    .milk-type-option input[type="radio"]:checked + .milk-type-option {
      border-color: #FF9EBB;
      background: #FFF0F5;
    }

    /* 奶类型标签 */
    .milk-record-type {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 2px;
    }

    .type-breast {
      background: #FFF0F5;
      color: #FF9EBB;
    }

    .type-formula {
      background: #F0F8FF;
      color: #87CEEB;
    }

    /* 奶类型分类汇总 */
    .milk-type-summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      padding: 14px 20px;
      background: rgba(255, 240, 245, 0.4);
      border-radius: 14px;
    }

    .milk-type-summary-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .milk-type-summary-icon {
      font-size: 18px;
    }

    .milk-type-summary-text {
      font-size: 13px;
      color: #A99BAA;
    }

    .milk-type-summary-val {
      font-size: 16px;
      font-weight: 700;
      color: #5D4E60;
    }

    .milk-type-summary-divider {
      width: 1px;
      height: 24px;
      background: #F0E0E8;
    }
  </style>
</head>
<body>

  <!-- 背景星星装饰 -->
  <div class="sparkle-container">
    <span class="sparkle">✦</span>
    <span class="sparkle">✧</span>
    <span class="sparkle">⭐</span>
    <span class="sparkle">✦</span>
    <span class="sparkle">✧</span>
  </div>

  <!-- ========== Toast 提示 ========== -->
  <div id="toast" class="toast"></div>

  <!-- ========== 顶部导航栏 ========== -->
  <nav class="navbar">
    <div class="navbar-title" id="navTitle">多米的成长记录 🌱</div>
    <div class="navbar-nav">
      <button class="nav-tab active" data-page="milk" onclick="navigateTo('milk')">每日喝奶 🍼</button>
      <button class="nav-tab" data-page="list" onclick="navigateTo('list')">成长记录 📋</button>
      <button class="nav-tab" data-page="chart" onclick="navigateTo('chart')">成长曲线 📈</button>
    </div>
    <div class="navbar-actions">

  <script>
    /* ====================================================================
       儿童成长记录 - 主脚本
       功能：数据录入、记录列表（含编辑删除）、成长曲线图、localStorage持久化
    ==================================================================== */

    // ========== 常量与工具函数 ==========

    /** 生成简易UUID */
    function generateId() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    /** 获取今天的日期字符串 YYYY-MM-DD */
    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    /**
     * 根据出生日期和记录日期计算年龄
     * 返回 "X岁Y月" 格式
     */
    function calcAge(birthDateStr, recordDateStr) {
      if (!birthDateStr || !recordDateStr) return '--';
      const birth = new Date(birthDateStr);
      const record = new Date(recordDateStr);

      if (record < birth) return '--';

      let years = record.getFullYear() - birth.getFullYear();
      let months = record.getMonth() - birth.getMonth();

      // 如果记录日期的天数小于出生日期的天数，月份减1
      if (record.getDate() < birth.getDate()) {
        months--;
      }

      // 修正月份为负的情况
      if (months < 0) {
        years--;
        months += 12;
      }

      // 如果年龄为0岁，只显示月数
      if (years === 0) {
        return months + '月';
      }
      return years + '岁' + months + '月';
    }

    /** 显示Toast提示 */
    function showToast(message, duration) {
      duration = duration || 2000;
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(function () {
        toast.classList.remove('show');
      }, duration);
    }

    // ========== localStorage 数据操作 ==========

    /** 获取所有成长记录 */
    function getRecords() {
      try {
        const data = localStorage.getItem('childGrowthRecords');
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    /** 保存所有成长记录 */
    function saveRecords(records) {
      localStorage.setItem('childGrowthRecords', JSON.stringify(records));
    }

    /** 获取宝宝信息 */
    function getChildInfo() {
      try {
        const data = localStorage.getItem('childGrowthInfo');
        return data ? JSON.parse(data) : null;
      } catch (e) {
        return null;
      }
    }

    /** 保存宝宝信息 */
    function saveChildInfo(info) {
      localStorage.setItem('childGrowthInfo', JSON.stringify(info));
    }

    // ========== 路由与导航 ==========

    let currentPage = 'milk';

    /** 页面导航函数 */
    function navigateTo(page) {
      currentPage = page;

      // 更新hash
      window.location.hash = page;

      // 切换导航高亮
      document.querySelectorAll('.nav-tab').forEach(function (tab) {
        tab.classList.toggle('active', tab.getAttribute('data-page') === page);
      });

      // 切换页面显示
      document.querySelectorAll('.page-section').forEach(function (section) {
        section.classList.remove('active');
      });

      // 使用requestAnimationFrame触发淡入效果
      const targetSection = document.getElementById('page-' + page);
      if (targetSection) {
        // 先设为display:block但opacity:0
        targetSection.style.display = 'block';
        targetSection.style.opacity = '0';
        // 下一帧添加active使其淡入
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            targetSection.classList.add('active');
            targetSection.style.opacity = '';
            targetSection.style.display = '';
          });
        });
      }

      // 页面切换时刷新对应内容
      if (page === 'list') {
        renderList();
      } else if (page === 'chart') {
        renderChart();
      } else if (page === 'milk') {
        renderMilkList();
      }
    }

    /** 监听hash变化 */
    window.addEventListener('hashchange', function () {
      const hash = window.location.hash.replace('#', '') || 'milk';
      if (hash !== currentPage) {
        navigateTo(hash);
      }
    });

    // ========== 表单验证工具 ==========

    /**
     * 通用表单验证
     * @param {Object} config - 验证配置
     * config.fields: [{ id, errorId, rules: [{test, msg}] }]
     * @returns {boolean}
     */
    function validateForm(config) {
      let valid = true;

      config.fields.forEach(function (field) {
        const input = document.getElementById(field.id);
        const errorEl = document.getElementById(field.errorId);
        const value = input.value.trim();

        // 清除之前的错误状态
        input.classList.remove('error');
        errorEl.textContent = '';
        errorEl.classList.remove('show');

        // 逐条检查规则
        for (let i = 0; i < field.rules.length; i++) {
          const rule = field.rules[i];
          if (!rule.test(value, input)) {
            input.classList.add('error');
            errorEl.textContent = rule.msg;
            errorEl.classList.add('show');
            valid = false;
            break;
          }
        }
      });

      return valid;
    }

    /** 清除表单所有错误状态 */
    function clearFormErrors(config) {
      config.fields.forEach(function (field) {
        const input = document.getElementById(field.id);
        const errorEl = document.getElementById(field.errorId);
        input.classList.remove('error');
        errorEl.textContent = '';
        errorEl.classList.remove('show');
      });
    }

    // ========== 成长记录列表 ==========

    let listCurrentPage = 1;
    const PAGE_SIZE = 10;

    /** 渲染列表页面 */
    function renderList() {
      const container = document.getElementById('listContent');
      const records = getRecords();

      // 按记录日期降序排序（最新在前）
      records.sort(function (a, b) {
        return b.recordDate.localeCompare(a.recordDate);
      });

      // 空状态
      if (records.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
          '  <div class="empty-state-icon">🌱🧸</div>' +
          '  <div class="empty-state-text">还没有成长记录哦~ 快来记录宝宝的成长瞬间吧！</div>' +
          '  <button class="empty-state-btn" onclick="openAddModal()">马上记录 ✨</button>' +
          '</div>';
        return;
      }

      // 计算分页
      const totalPages = Math.ceil(records.length / PAGE_SIZE);
      if (listCurrentPage > totalPages) listCurrentPage = totalPages;
      if (listCurrentPage < 1) listCurrentPage = 1;

      const startIdx = (listCurrentPage - 1) * PAGE_SIZE;
      const endIdx = Math.min(startIdx + PAGE_SIZE, records.length);
      const pageRecords = records.slice(startIdx, endIdx);

      const childInfo = getChildInfo();

      // 构建表格HTML
      let html = '<div class="table-wrapper"><table class="data-table">';
      html += '<thead><tr>';
      html += '<th>序号</th><th>记录日期</th><th>年龄</th><th>身高(cm)</th><th>体重(kg)</th><th>发育水平</th><th>操作</th>';
      html += '</tr></thead><tbody>';

      pageRecords.forEach(function (record, index) {
        const ageStr = calcAge(childInfo ? childInfo.birthDate : '', record.recordDate);
        const globalIndex = startIdx + index + 1;

        html += '<tr>';
        html += '<td>' + globalIndex + '</td>';
        html += '<td>' + record.recordDate + '</td>';
        html += '<td>' + ageStr + '</td>';
        html += '<td>' + record.height.toFixed(1) + '</td>';
        html += '<td>' + record.weight.toFixed(2) + '</td>';
        html += '<td>' + calcGrowthPercentLabel(childInfo ? childInfo.birthDate : '', record.recordDate, record.height, record.weight) + '</td>';
        html += '<td><div class="action-btns">';
        html += '<button class="btn btn-sm btn-blue" onclick="openEditModal(\'' + record.id + '\')">编辑</button>';
        html += '<button class="btn btn-sm btn-red" onclick="deleteRecord(\'' + record.id + '\')">删除</button>';
        html += '</div></td>';
        html += '</tr>';
      });

      html += '</tbody></table></div>';

      // 分页控件
      html += '<div class="pagination">';
      // 上一页按钮
      html += '<button class="page-btn" ' + (listCurrentPage <= 1 ? 'disabled' : '') + ' onclick="goListPage(' + (listCurrentPage - 1) + ')">&laquo;</button>';

      // 页码按钮
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 7 && i > 3 && i < totalPages - 1 && Math.abs(i - listCurrentPage) > 1) {
          if (i === 4 || i === totalPages - 2) {
            html += '<span style="padding: 0 4px; color: #A99BAA;">...</span>';
          }
          continue;
        }
        html += '<button class="page-btn ' + (i === listCurrentPage ? 'active' : '') + '" onclick="goListPage(' + i + ')">' + i + '</button>';
      }

      // 下一页按钮
      html += '<button class="page-btn" ' + (listCurrentPage >= totalPages ? 'disabled' : '') + ' onclick="goListPage(' + (listCurrentPage + 1) + ')">&raquo;</button>';
      html += '</div>';

      container.innerHTML = html;
    }

    /** 跳转到指定页 */
    function goListPage(page) {
      listCurrentPage = page;
      renderList();
    }

    /** 删除记录 */
    function deleteRecord(id) {
      if (!confirm('确定要删除这条记录吗？删除后不可恢复。')) return;

      let records = getRecords();
      records = records.filter(function (r) { return r.id !== id; });
      saveRecords(records);

      showToast('✨ 记录已删除');
      renderList();
    }

    /** 打开新增记录模态框 */
    function openAddModal() {
      document.getElementById('addModal').classList.add('show');
      // 设置日期最大值为今天
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('addDate').setAttribute('max', today);
      // 清空表单和错误提示
      document.getElementById('addForm').reset();
      clearFormErrors({
        fields: [
          { id: 'addDate', errorId: 'addDateError' },
          { id: 'addHeight', errorId: 'addHeightError' },
          { id: 'addWeight', errorId: 'addWeightError' }
        ]
      });
      // 聚焦到日期输入框
      setTimeout(function() { document.getElementById('addDate').focus(); }, 100);
    }

    /** 关闭新增记录模态框 */
    function closeAddModal() {
      document.getElementById('addModal').classList.remove('show');
      clearFormErrors({
        fields: [
          { id: 'addDate', errorId: 'addDateError' },
          { id: 'addHeight', errorId: 'addHeightError' },
          { id: 'addWeight', errorId: 'addWeightError' }
        ]
      });
    }

    /** 新增模态框遮罩点击处理 */
    function handleAddModalOverlayClick(event) {
      if (event.target === event.currentTarget) {
        closeAddModal();
      }
    }

    /** 处理新增记录提交 */
    function handleAddSubmit(event) {
      event.preventDefault();

      // 表单验证
      const today = new Date().toISOString().split('T')[0];
      const valid = validateForm({
        fields: [
          {
            id: 'addDate',
            errorId: 'addDateError',
            rules: [
              { test: function(v) { return v.trim() !== ''; }, msg: '请选择记录日期' },
              { test: function(v) { return v <= today; }, msg: '日期不能是未来日期' }
            ]
          },
          {
            id: 'addHeight',
            errorId: 'addHeightError',
            rules: [
              { test: function(v) { return v.trim() !== ''; }, msg: '请输入身高' },
              { test: function(v) { return v > 0 && v <= 250; }, msg: '身高需在 1-250 cm 之间' }
            ]
          },
          {
            id: 'addWeight',
            errorId: 'addWeightError',
            rules: [
              { test: function(v) { return v.trim() !== ''; }, msg: '请输入体重' },
              { test: function(v) { return v > 0 && v <= 200; }, msg: '体重需在 0.1-200 kg 之间' }
            ]
          }
        ]
      });

      if (!valid) return;

      const date = document.getElementById('addDate').value;
      const height = parseFloat(document.getElementById('addHeight').value);
      const weight = parseFloat(document.getElementById('addWeight').value);

      // 生成记录
      const newRecord = {
        id: generateId(),
        recordDate: date,
        height: height,
        weight: weight
      };

      // 保存到 localStorage
      const records = getRecords();
      records.push(newRecord);
      saveRecords(records);

      // 关闭模态框并刷新列表
      closeAddModal();

    let growthChart = null;

    /**
     * WHO参考标准（近似值）
     * 键为月龄，值为 { avgHeight(cm), avgWeight(kg) }
     * 基于 WHO 儿童生长标准 50th 百分位（中位数）
     */
    const whoReference = {
      0:  { avgHeight: 50, avgWeight: 3.3 },
      1:  { avgHeight: 54.7, avgWeight: 4.5 },
      2:  { avgHeight: 58.4, avgWeight: 5.6 },

      144: { avgHeight: 149.6, avgWeight: 37.5 },
      156: { avgHeight: 156.0, avgWeight: 42.0 },
      168: { avgHeight: 162.0, avgWeight: 47.0 },
      180: { avgHeight: 168.0, avgWeight: 52.5 }
    };

    /**
     * 根据出生日期和记录日期，查找对应的 WHO 50th 百分位参考值
     * 返回 { months: number, avgHeight: number, avgWeight: number } 或 null
     */
    function getWhoForAge(birthDateStr, recordDateStr) {
      if (!birthDateStr || !recordDateStr) return null;
      var birth = new Date(birthDateStr);
      var record = new Date(recordDateStr);
      if (record < birth) return null;

      var months = (record.getFullYear() - birth.getFullYear()) * 12 +
        (record.getMonth() - birth.getMonth());
      if (record.getDate() < birth.getDate()) months--;
      months = Math.max(0, months);

      // 在 WHO 表中找最近的月龄
      var ageKeys = Object.keys(whoReference).map(Number).sort(function (a, b) { return a - b; });
      var closestKey = ageKeys[0];
      var minDiff = Math.abs(months - closestKey);
      for (var i = 1; i < ageKeys.length; i++) {
        var diff = Math.abs(months - ageKeys[i]);
        if (diff < minDiff) {
          minDiff = diff;
          closestKey = ageKeys[i];
        }
      }

      var ref = whoReference[closestKey];
      return { months: months, closestMonth: closestKey, avgHeight: ref.avgHeight, avgWeight: ref.avgWeight };
    }

    /**
     * 计算发育水平百分比标签
     * 返回如 "身高88% 体重92%" 的可读字符串
     */
    function calcGrowthPercentLabel(birthDateStr, recordDateStr, height, weight) {
      var who = getWhoForAge(birthDateStr, recordDateStr);
      if (!who) return '<span class="pct-na">--</span>';

      var hPct = Math.round((height / who.avgHeight) * 100);
      var wPct = Math.round((weight / who.avgWeight) * 100);

      // 根据百分比选择颜色/标签
      function pctClass(pct) {
        if (pct >= 90) return 'pct-good';
        if (pct >= 75) return 'pct-normal';
        return 'pct-low';
      }
      function pctIcon(pct) {
        if (pct >= 95) return '🌟';
        if (pct >= 90) return '😊';
        if (pct >= 75) return '👌';
        return '💪';
      }

      return '<span class="pct-tag ' + pctClass(Math.min(hPct, wPct)) + '">' +
        pctIcon(Math.min(hPct, wPct)) + ' ' + hPct + '% / ' + wPct + '%' +
        '</span>';
    }

    /** 渲染图表 */
    function renderChart() {
      const records = getRecords();
      const childInfo = getChildInfo();
      const canvas = document.getElementById('growthChart');

      // 销毁旧图表
      if (growthChart) {
        growthChart.destroy();
        growthChart = null;
      }

      // 空状态
      if (records.length === 0) {
        canvas.style.display = 'none';
        const parent = canvas.parentElement;
        // 移除可能存在的空状态元素
        const existingEmpty = parent.querySelector('.empty-state');
        if (existingEmpty) existingEmpty.remove();

        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-state';
        emptyDiv.innerHTML =
          '<div class="empty-state-icon">🌱🧸</div>' +
          '<div class="empty-state-text">还没有数据哦，快来记录宝宝的成长吧~</div>' +
          '<button class="empty-state-btn" onclick="openAddModal()">马上记录 ✨</button>';
        parent.appendChild(emptyDiv);
        return;
      }

      canvas.style.display = '';
      // 移除空状态元素
      const emptyStateEl = canvas.parentElement.querySelector('.empty-state');
      if (emptyStateEl) emptyStateEl.remove();

      // 按日期升序排列（时间轴从旧到新）
      records.sort(function (a, b) {
        return a.recordDate.localeCompare(b.recordDate);
      });

      // 提取数据
      const labels = records.map(function (r) { return r.recordDate; });
      const heightData = records.map(function (r) { return r.height; });
      const weightData = records.map(function (r) { return r.weight; });

      // 构建WHO参考线数据
      const whoHeightData = [];
      const whoWeightData = [];

      if (childInfo && childInfo.birthDate) {
        const birthDate = new Date(childInfo.birthDate);

        records.forEach(function (r) {
          const recordDate = new Date(r.recordDate);
          // 计算月龄
          let months = (recordDate.getFullYear() - birthDate.getFullYear()) * 12 +
            (recordDate.getMonth() - birthDate.getMonth());
          if (recordDate.getDate() < birthDate.getDate()) months--;
          months = Math.max(0, months);

          // 查找最近的WHO参考值（取最近的月龄）
          const ageKeys = Object.keys(whoReference).map(Number).sort(function (a, b) { return a - b; });
          let closestKey = ageKeys[0];
          let minDiff = Math.abs(months - closestKey);
          for (let i = 1; i < ageKeys.length; i++) {
            const diff = Math.abs(months - ageKeys[i]);
            if (diff < minDiff) {
              minDiff = diff;
              closestKey = ageKeys[i];
            }
          }

          const ref = whoReference[closestKey];
          whoHeightData.push(ref.avgHeight);
          whoWeightData.push(ref.avgWeight);
        });
      }

      // 构建数据集
      const datasets = [
        {
          label: '身高 (cm)',

          borderColor: '#FF9EBB',
          backgroundColor: 'rgba(255, 158, 187, 0.1)',

          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.3,

        },
        {
          label: '体重 (kg)',
          data: weightData,
          borderColor: '#87CEEB',
          backgroundColor: 'rgba(135, 206, 235, 0.1)',
          borderWidth: 2.5,
          pointBackgroundColor: '#87CEEB',
          pointBorderColor: '#FFFFFF',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.3,
          yAxisID: 'yWeight'
        }
      ];

      // 如果有WHO参考数据，添加参考线
      if (whoHeightData.length > 0) {
        datasets.push({
          label: 'WHO身高参考 (cm)',
          data: whoHeightData,
          borderColor: '#FF9EBB',
          borderWidth: 1,
          borderDash: [6, 4],
          pointRadius: 0,
          pointHoverRadius: 0,
          fill: false,
          tension: 0.3,
          yAxisID: 'yHeight'
        });
        datasets.push({
          label: 'WHO体重参考 (kg)',
          data: whoWeightData,
          borderColor: '#87CEEB',
          borderWidth: 1,
          borderDash: [6, 4],
          pointRadius: 0,
          pointHoverRadius: 0,
          fill: false,
          tension: 0.3,
          yAxisID: 'yWeight'
        });
      }

      // 创建图表
      const ctx = canvas.getContext('2d');
      growthChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {

              position: 'top',

              padding: 12,
              cornerRadius: 12,
              callbacks: {
                title: function (tooltipItems) {
                  return '日期: ' + tooltipItems[0].label;
                },
                label: function (context) {
                  let label = context.dataset.label || '';
                  let value = context.parsed.y;
                  if (label.includes('身高')) {
                    return label + ': ' + value.toFixed(1) + ' cm';
                  } else {
                    return label + ': ' + value.toFixed(2) + ' kg';
                  }
                },
                afterBody: function (tooltipItems) {
                  // 在tooltip底部显示年龄信息和发育水平
                  if (childInfo && childInfo.birthDate) {
                    var dateLabel = tooltipItems[0].label;
                    var ageStr = calcAge(childInfo.birthDate, dateLabel);

                    // 查找对应的记录数据
                    var sortedRecords = getRecords().sort(function (a, b) {
                      return a.recordDate.localeCompare(b.recordDate);

                    var matchedRecord = null;
                    for (var i = 0; i < sortedRecords.length; i++) {
                      if (sortedRecords[i].recordDate === dateLabel) {

                    var lines = ['年龄: ' + ageStr];
                    if (matchedRecord) {
                      var who = getWhoForAge(childInfo.birthDate, dateLabel);
                      if (who) {
                        var hPct = Math.round((matchedRecord.height / who.avgHeight) * 100);
                        var wPct = Math.round((matchedRecord.weight / who.avgWeight) * 100);
                        lines.push('');
                        lines.push('WHO参考: ' + who.avgHeight + 'cm / ' + who.avgWeight + 'kg');
                        lines.push('发育水平: 身高' + hPct + '% 体重' + wPct + '%');
                      }
                    }
                    return lines;

      });

      if (!valid) return;

      var editId = document.getElementById('editMilkId').value;
      var records = getMilkRecords();
      for (var i = 0; i < records.length; i++) {
        if (records[i].id === editId) {
          records[i].milkDate = document.getElementById('editMilkDate').value;
          records[i].milkTime = document.getElementById('editMilkTime').value;
          records[i].milkAmount = parseInt(document.getElementById('editMilkAmount').value);
          records[i].milkType = document.querySelector('input[name="editMilkType"]:checked').value;
          break;
        }
      }
      saveMilkRecords(records);

      closeEditMilkModal();
      showToast('✨ 喝奶记录已更新');
      renderMilkList();
    }

    /** 渲染喝奶记录列表 */
    function renderMilkList() {
      var container = document.getElementById('milkListContent');
      var summaryContainer = document.getElementById('milkTodaySummary');
      var allRecords = getMilkRecords();

      // 获取筛选日期（默认今天）
      var filterDate = document.getElementById('milkFilterDate').value;
      if (!filterDate) {
        filterDate = getTodayStr();
        document.getElementById('milkFilterDate').value = filterDate;
      }

      // 计算今日/筛选日期总量
      var dayRecords = allRecords.filter(function(r) { return r.milkDate === filterDate; });
      dayRecords.sort(function(a, b) { return a.milkTime.localeCompare(b.milkTime); });

      var dayTotal = 0;
      var breastTotal = 0, formulaTotal = 0;
      dayRecords.forEach(function(r) {
        dayTotal += r.milkAmount;
        if (r.milkType === 'breast') {
          breastTotal += r.milkAmount;
        } else {
          formulaTotal += r.milkAmount;
        }
      });
      var dayCount = dayRecords.length;

      // 渲染今日总量卡片
      if (dayCount > 0) {
        summaryContainer.innerHTML =
          '<div class="milk-summary-inner">' +
            '<div class="milk-summary-icon">🍼</div>' +
            '<div class="milk-summary-info">' +
              '<div class="milk-summary-label">' + filterDate + ' 喝奶总量</div>' +
              '<div class="milk-summary-total">' + dayTotal + ' <span class="milk-summary-unit">ml</span></div>' +
            '</div>' +
            '<div class="milk-summary-count">共 ' + dayCount + ' 次</div>' +
          '</div>' +
          '<div class="milk-type-summary">' +
            '<div class="milk-type-summary-item">' +
              '<span class="milk-type-summary-icon">🤱</span>' +
              '<span class="milk-type-summary-text">母乳</span>' +
              '<span class="milk-type-summary-val">' + breastTotal + ' ml</span>' +
            '</div>' +
            '<div class="milk-type-summary-divider"></div>' +
            '<div class="milk-type-summary-item">' +
              '<span class="milk-type-summary-icon">🍼</span>' +
              '<span class="milk-type-summary-text">奶粉</span>' +
              '<span class="milk-type-summary-val">' + formulaTotal + ' ml</span>' +
            '</div>' +
          '</div>';
      } else {
        summaryContainer.innerHTML = '';
      }

      // 空状态
      if (dayRecords.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
          '  <div class="empty-state-icon">🍼🧸</div>' +
          '  <div class="empty-state-text">这一天还没有喝奶记录哦~</div>' +
          '  <button class="empty-state-btn" onclick="openMilkModal()">马上记录 ✨</button>' +
          '</div>';
        return;
      }

      // 构建记录列表
      var html = '<div class="milk-record-list">';
      var runningTotal = 0;
      dayRecords.forEach(function(record) {
        runningTotal += record.milkAmount;
        html += '<div class="milk-record-item">';
        html += '  <div class="milk-record-left">';
        html += '    <div class="milk-record-time">⏰ ' + record.milkTime + '</div>';
        html += '  </div>';
        html += '  <div class="milk-record-center">';
        html += '    <div class="milk-record-amount">' + record.milkAmount + ' <span class="milk-record-unit">ml</span></div>';
        html += '    <div class="milk-record-type ' + (record.milkType === 'breast' ? 'type-breast' : 'type-formula') + '">' + (record.milkType === 'breast' ? '🤱 母乳' : '🍼 奶粉') + '</div>';
        html += '  </div>';
        html += '  <div class="milk-record-right">';
        html += '    <div class="milk-record-running">累计 ' + runningTotal + ' ml</div>';
        html += '    <button class="btn btn-sm btn-blue" onclick="openEditMilkModal(\'' + record.id + '\')">修改</button>';
        html += '    <button class="btn btn-sm btn-red" onclick="deleteMilkRecord(\'' + record.id + '\')">删除</button>';
        html += '  </div>';
        html += '</div>';
      });
      html += '</div>';

      container.innerHTML = html;
    }

    // ========== 键盘事件 ==========

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        // 关闭修改喝奶模态框
        if (document.getElementById('editMilkModal').classList.contains('show')) {
          closeEditMilkModal();
        }
        // 关闭喝奶模态框
        if (document.getElementById('milkModal').classList.contains('show')) {
          closeMilkModal();
        }
        // 关闭新增模态框
        if (document.getElementById('addModal').classList.contains('show')) {
          closeAddModal();
        }
        // 关闭编辑模态框
        if (document.getElementById('editModal').classList.contains('show')) {
          closeEditModal();
        }
        // 关闭宝宝信息模态框
        if (document.getElementById('childInfoModal').classList.contains('show')) {
          closeChildInfoModal();
        }
      }
    });

    // ========== 初始化 ==========

    function init() {
      // 设置日期选择器的最大值为今天
      const today = getTodayStr();
      document.getElementById('editDate').setAttribute('max', today);
      document.getElementById('addDate').setAttribute('max', today);
      document.getElementById('childBirthDate').setAttribute('max', today);
      document.getElementById('milkDate').setAttribute('max', today);

      // 更新导航栏标题
      updateNavTitle();

      // 检查是否首次访问（无宝宝信息）
      const childInfo = getChildInfo();
      if (!childInfo) {
        showChildInfoModal();
      }

      // 根据hash导航到对应页面
      const hash = window.location.hash.replace('#', '') || 'milk';
      navigateTo(hash);
    }

    // DOM加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);

    // 注册 Service Worker 实现PWA离线使用
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((registration) => {
            console.log('Service Worker 注册成功:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker 注册失败:', error);
          });
      });
    }
  </script>

</body>
</html>

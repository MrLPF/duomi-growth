<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="多米成长">
  <meta name="description" content="离线优先、数据本地加密保存的成长记录应用">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>多米成长记录</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">离线加密记录</p>
        <h1>多米成长记录</h1>
      </div>
      <button id="lockButton" class="ghost hidden" type="button">锁定</button>
    </header>

    <main>
      <section id="authView" class="card auth-card">
        <div id="setupPanel" class="hidden">
          <h2>首次使用</h2>
          <p>设置主密码。密码只用于在本机派生加密密钥，不会上传到 GitHub。</p>
          <form id="setupForm" class="stack">
            <label>显示名称<input id="displayName" maxlength="40" autocomplete="nickname" placeholder="例如：多米"></label>
            <label>主密码<input id="setupPassword" type="password" minlength="8" required autocomplete="new-password"></label>
            <label>确认密码<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label>
            <button class="primary" type="submit">创建本地加密空间</button>
          </form>
        </div>

        <div id="unlockPanel" class="hidden">
          <h2>解锁应用</h2>
          <p>输入主密码以解密本机数据。</p>
          <form id="unlockForm" class="stack">
            <label>主密码<input id="unlockPassword" type="password" required autocomplete="current-password"></label>
            <button class="primary" type="submit">解锁</button>
          </form>
          <button id="restoreFromLock" class="text-button" type="button">从加密备份恢复</button>
        </div>
        <p id="authMessage" class="message" role="status"></p>
      </section>

      <section id="mainView" class="hidden">
        <section class="card summary-card">
          <div>
            <p class="eyebrow">当前档案</p>
            <h2 id="profileTitle">成长记录</h2>
          </div>
          <div class="summary-grid">
            <div><span>记录数</span><strong id="recordCount">0</strong></div>
            <div><span>最近记录</span><strong id="latestDate">暂无</strong></div>
          </div>
        </section>

        <section class="card">
          <h2>新增记录</h2>
          <form id="recordForm" class="form-grid">
            <label>日期<input id="recordDate" type="date" required></label>
            <label>类型<select id="recordType"><option value="height">身高</option><option value="weight">体重</option><option value="milestone">成长事件</option><option value="note">日常记录</option></select></label>
            <label>数值<input id="recordValue" inputmode="decimal" placeholder="例如 98.5"></label>
            <label class="wide">备注<textarea id="recordNote" rows="3" maxlength="500" placeholder="记录今天的变化"></textarea></label>
            <button class="primary wide" type="submit">保存记录</button>
          </form>
        </section>

        <section class="card">
          <div class="section-heading">
            <h2>历史记录</h2>
            <button id="clearRecords" class="danger ghost" type="button">清空</button>
          </div>
          <div id="recordsList" class="records-list"></div>
        </section>

        <section class="card">
          <h2>数据与安全</h2>
          <div class="button-grid">
            <button id="exportButton" type="button">导出加密备份</button>
            <button id="importButton" type="button">导入加密备份</button>
            <button id="changePasswordButton" type="button">修改主密码</button>
          </div>
          <input id="importFile" class="hidden" type="file" accept=".duomi,.json,application/json">
          <p class="fine-print">GitHub Pages 地址本身仍可能公开；个人数据只保存在此设备，并以 AES-GCM 加密。请定期导出备份。</p>
        </section>
      </section>
    </main>

    <footer>多米成长记录 · PWA 离线版</footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>

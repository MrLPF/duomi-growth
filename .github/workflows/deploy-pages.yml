name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact archive page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/icons
          cat archive/index.html.gz.b64.part* | tr -d '\n\r' | base64 --decode | gzip -dc > _site/index.html
          echo '822011470386e15a5d3be8028b338202adec9c134734ab2ad6daf33e9b5cfc3b  _site/index.html' | sha256sum --check --strict

      - name: Restore pinned Chart.js
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js' \
            --output _site/chart.umd.min.js
          echo '206b6e8bb00fc7bba2c7ee80ca41db3e9e05ba7be0aa35abeba9cfd5357f5d0e  _site/chart.umd.min.js' | sha256sum --check --strict

      - name: Copy offline and security assets
        shell: bash
        run: |
          set -euo pipefail
          cp manifest.json secure-vault.css secure-vault.js sw.js _site/
          if [ -f reset.html ]; then cp reset.html _site/; fi
          if [ -f reset.js ]; then cp reset.js _site/; fi
          if [ -f .nojekyll ]; then cp .nojekyll _site/; else touch _site/.nojekyll; fi

      - name: Generate PNG app icons
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > _site/icons/icon-192.png
          printf '%s' '' | base64 --decode > _site/icons/icon-512.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

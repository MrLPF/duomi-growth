name: Sync exact archive page to repository root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact original page
        shell: bash
        run: |
          set -euo pipefail
          cat archive/index.html.gz.b64.part* | tr -d '\n\r' | base64 --decode | gzip -dc > index.html.generated
          echo '822011470386e15a5d3be8028b338202adec9c134734ab2ad6daf33e9b5cfc3b  index.html.generated' | sha256sum --check --strict
          mv index.html.generated index.html

      - name: Restore exact Chart.js file
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js' \
            --output chart.umd.min.js
          echo '206b6e8bb00fc7bba2c7ee80ca41db3e9e05ba7be0aa35abeba9cfd5357f5d0e  chart.umd.min.js' | sha256sum --check --strict

      - name: Generate PNG app icons
        shell: bash
        run: |
          mkdir -p icons
          python3 - <<'PY'
          import binascii
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def write_icon(size, path):
              bg = (255, 249, 250)
              pink = (255, 158, 187)
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      margin = size // 8
                      row.extend(pink if margin <= x < size - margin and margin <= y < size - margin else bg)
                  rows.append(bytes(row))
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0))
              data += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
              data += chunk(b'IEND', b'')
              Path(path).write_bytes(data)

          write_icon(192, 'icons/icon-192.png')
          write_icon(512, 'icons/icon-512.png')
          PY

      - name: Commit generated root files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html chart.umd.min.js icons/icon-192.png icons/icon-512.png
          if git diff --cached --quiet; then
            echo 'Root files already match the exact archive build.'
            exit 0
          fi
          git commit -m 'build: sync exact archive page [skip ci]'
          git push
